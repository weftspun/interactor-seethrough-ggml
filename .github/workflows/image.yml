name: image

# Builds the linux/amd64 runtime image and pushes it to GHCR.
# Native amd64 runner on purpose: cross-building this under qemu from arm64
# is slow and fragile for a Vulkan/shader toolchain.

on:
  workflow_dispatch:
  push:
    # TEMPORARY: add-runpod-image publishes so the image can be pulled and
    # verified on real GPU hardware before merging. Drop it from this list
    # once verified -- main should be the only publishing branch.
    branches: [main, add-runpod-image]
    paths: &image_paths
      - 'Dockerfile'
      - 'src/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'scripts/**'
      - '.github/workflows/image.yml'
  # Build (but do not publish) on PRs, so a Dockerfile change is proven
  # before it reaches main. GHCR push is gated below on event type.
  pull_request:
    paths: *image_paths

# Cancel superseded runs of the same PR or branch. Keyed so push and
# pull_request land in different groups -- otherwise a PR run would cancel
# the push run that does the publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    # Serialise image builds repo-wide. These are 10+ minute CUDA/Vulkan
    # builds; a pushed stack starts one per branch and they only contend for
    # runners. The workflow-level group above still cancels superseded runs
    # of the same branch -- this one only throttles across branches.
    # Caveat: GitHub queues at most one pending run per group and cancels the
    # rest, so a stack PR whose build is dropped needs a manual re-run.
    concurrency:
      group: image-serialize-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The CUDA devel base plus a full C++/Vulkan build tree is large; the
      # default runner disk is not generous. Reclaim before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
